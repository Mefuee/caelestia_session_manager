name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        run: shellcheck --severity=warning install.sh uninstall.sh tests/smoke.sh

      - name: Python syntax check
        run: python3 -m py_compile src/session_manager.py

      - name: Validate config.example.json
        run: python3 -m json.tool config.example.json > /dev/null

  smoke:
    name: Install / uninstall smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: tests/smoke.sh
